name: Sync Upstream & Origin Secure Lock

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-and-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Reset to Clean Upstream
        run: |
          git remote add upstream https://github.com/KJGX66F/usque-custom-pro.git || true
          git fetch upstream main
          # 强制将 pages 目录重置为官方最新纯净版，清除历史残留
          git checkout upstream/main -- pages/
          git checkout HEAD -- README.md 2>/dev/null || true

      - name: Apply Minimal Zero-Leak Guard
        run: |
          git rm -f pages/_routes.json 2>/dev/null || rm -f pages/_routes.json

          cat << 'EOF' > patch_worker.js
          const fs = require("fs");
          const file = "pages/_worker.js";
          let code = fs.readFileSync(file, "utf8");

          const authHeaderSection = `
          // === System Admin Console Authentication Guard ===
          async function getAuthToken(pass) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("gateway_sys_" + pass));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
          }

          function getSessionCookie(request) {
            const cookie = request.headers.get("Cookie");
            if (!cookie) return null;
            const match = cookie.match(/(?:^|;\\s*)sys_auth_token=([^;]+)/);
            return match ? match[1] : null;
          }

          const LOGIN_PAGE_HTML = \`<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cloud Core Console - 控制台网关</title>
            <style>
              :root {
                --bg: #0b0f19;
                --card: rgba(22, 31, 48, 0.8);
                --border: rgba(255, 255, 255, 0.08);
                --accent: #3b82f6;
                --accent-hover: #2563eb;
                --text: #f3f4f6;
                --muted: #9ca3af;
                --input: rgba(15, 23, 42, 0.7);
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background-color: var(--bg);
                background-image: 
                  radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
              }
              .panel {
                width: 100%;
                max-width: 400px;
                background: var(--card);
                backdrop-filter: blur(16px);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 36px 30px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
              }
              .header { text-align: center; margin-bottom: 26px; }
              .icon-box {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(99, 102, 241, 0.2));
                border: 1px solid rgba(59, 130, 246, 0.3);
                border-radius: 12px;
                margin-bottom: 16px;
                color: #60a5fa;
              }
              .title { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
              .subtitle { font-size: 13px; color: var(--muted); }
              .status-tag {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 11px;
                color: #10b981;
                background: rgba(16, 185, 129, 0.1);
                padding: 3px 10px;
                border-radius: 20px;
                margin-top: 10px;
                border: 1px solid rgba(16, 185, 129, 0.2);
              }
              .dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; }
              .field { margin-bottom: 20px; }
              label { display: block; font-size: 13px; font-weight: 500; color: #d1d5db; margin-bottom: 8px; }
              input[type="password"] {
                width: 100%;
                background: var(--input);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 8px;
                padding: 12px 14px;
                color: #fff;
                font-size: 14px;
                transition: all 0.2s;
              }
              input[type="password"]:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
              }
              .actions { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 22px; }
              .check { display: flex; align-items: center; gap: 7px; cursor: pointer; }
              button[type="submit"] {
                width: 100%;
                background: linear-gradient(135deg, var(--accent), var(--accent-hover));
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 12px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s;
              }
              button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
              .alert {
                display: none;
                background: rgba(239, 68, 68, 0.12);
                border: 1px solid rgba(239, 68, 68, 0.3);
                color: #fca5a5;
                font-size: 13px;
                padding: 10px 14px;
                border-radius: 8px;
                margin-bottom: 18px;
                text-align: center;
              }
              .footer { text-align: center; margin-top: 24px; font-size: 11px; color: #6b7280; }
            </style>
          </head>
          <body>
            <div class="panel">
              <div class="header">
                <div class="icon-box">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                    <line x1="6" y1="6" x2="6.01" y2="6"></line>
                    <line x1="6" y1="18" x2="6.01" y2="18"></line>
                  </svg>
                </div>
                <h1 class="title">Cloud Core Console</h1>
                <p class="subtitle">企业级云端资产与服务协同平台</p>
                <div class="status-tag"><span class="dot"></span>网关服务就绪</div>
              </div>
              <div id="alertBox" class="alert"></div>
              <form id="authForm" autocomplete="off">
                <div class="field">
                  <label for="password">系统访问授权凭证 (Access Key)</label>
                  <input type="password" id="password" autocomplete="new-password" required autofocus>
                </div>
                <div class="actions">
                  <label class="check">
                    <input type="checkbox" id="keepSession" checked> 记住此设备 (30天)
                  </label>
                  <span>TLS 1.3 传输加密</span>
                </div>
                <button type="submit" id="submitBtn">验证凭证并进入</button>
              </form>
              <div class="footer">
                © 2026 Cloud Ops Services. Enterprise Restricted Area.
              </div>
            </div>
            <script>
              const form = document.getElementById("authForm");
              const alertBox = document.getElementById("alertBox");
              const btn = document.getElementById("submitBtn");

              form.addEventListener("submit", async (e) => {
                e.preventDefault();
                alertBox.style.display = "none";
                btn.disabled = true;
                btn.innerText = "校验凭证中...";

                try {
                  const res = await fetch("/api/sys/auth", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      password: document.getElementById("password").value
                    })
                  });
                  const data = await res.json();
                  if (res.ok && data.success) {
                    btn.innerText = "认证成功，正在载入...";
                    window.location.reload();
                  } else {
                    alertBox.innerText = data.message || "授权凭证校验失败，禁止访问";
                    alertBox.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "验证凭证并进入";
                  }
                } catch (err) {
                  alertBox.innerText = "网关通信异常";
                  alertBox.style.display = "block";
                  btn.disabled = false;
                  btn.innerText = "验证凭证并进入";
                }
              });
            </script>
          </body>
          </html>\`;
          `;

          // 使用 __auth_url 避免与上游原本的 const url 产生任何冲突
          const fetchInterceptor = `
          // 1. Session Gateway Authentication
          if (env.AUTH_PASS) {
            const __auth_url = new URL(request.url);
            const expectedToken = await getAuthToken(env.AUTH_PASS);
            const userToken = getSessionCookie(request);

            // 登录校验端点
            if (__auth_url.pathname === "/api/sys/auth" && request.method === "POST") {
              try {
                const body = await request.json();
                if (body.password === env.AUTH_PASS) {
                  return new Response(JSON.stringify({ success: true, message: "OK" }), {
                    status: 200,
                    headers: {
                      "Content-Type": "application/json; charset=utf-8",
                      "Set-Cookie": "sys_auth_token=" + expectedToken + "; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000"
                    }
                  });
                }
                return new Response(JSON.stringify({ success: false, message: "授权凭证校验失败，禁止访问" }), {
                  status: 401,
                  headers: { "Content-Type": "application/json; charset=utf-8" }
                });
              } catch (e) {
                return new Response(JSON.stringify({ success: false, message: "无效的请求格式" }), {
                  status: 400,
                  headers: { "Content-Type": "application/json; charset=utf-8" }
                });
              }
            }

            // 未登录拦截
            if (userToken !== expectedToken) {
              if (__auth_url.pathname.startsWith("/api/")) {
                return json({ message: "Authentication required", code: 401 }, 401);
              }
              return new Response(LOGIN_PAGE_HTML, {
                status: 200,
                headers: { "Content-Type": "text/html; charset=utf-8" }
              });
            }
          }
          `;

          let transformed = authHeaderSection + "\n" + code;
          transformed = transformed.replace(
            /async\s+fetch\s*\(\s*request\s*(\,\s*env)?\s*(\,\s*ctx)?\s*\)\s*\{/,
            "async fetch(request, env, ctx) {" + fetchInterceptor
          );
          transformed = transformed.replace(
            /return\s+json\(\{\s*message:\s*"API Not Found"\s*\}\,\s*404\);/,
            "return env.ASSETS ? env.ASSETS.fetch(request) : json({ message: \"API Not Found\" }, 404);"
          );

          fs.writeFileSync(file, transformed, "utf8");
          EOF

          node patch_worker.js
          rm -f patch_worker.js
          node -c pages/_worker.js
          echo "Pages worker syntax verified successfully."

      - name: Commit and Push Changes
        run: |
          git add pages/
          if git diff --staged --quiet; then
            echo "No changes detected. Repository is up to date."
          else
            git commit -m "chore: sync upstream and apply minimal zero-leak guard"
            git push origin main
          fi
