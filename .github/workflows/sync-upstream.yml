name: Sync Upstream & Origin Secure Lock

on:
  schedule:
    # 每天凌晨 0 点自动拉取上游更新
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动一键运行

jobs:
  sync-and-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/KJGX66F/usque-custom-pro.git || true
          git fetch upstream main
          # 仅拉取变更，暂不提交，保留我们自己的 README.md
          git merge upstream/main --no-commit --no-ff || true
          git checkout HEAD -- README.md 2>/dev/null || true

      - name: Apply Universal Auth Hook (Zero-Secret)
        run: |
          # 1. 移除 _routes.json，强制 Pages 全站（含首页静态页面）全部走 _worker.js 拦截
          rm -f pages/_routes.json

          # 2. 注入通用环境变量鉴权逻辑（不含任何明文密码）
          node -e '
          const fs = require("fs");
          const file = "pages/_worker.js";
          let code = fs.readFileSync(file, "utf8");

          // 注入的脱敏鉴权中间件逻辑：读取 Cloudflare 后台的 env.AUTH_PASS
          const authMiddleware = `
          // === Universal Environment Auth Guard ===
          if (env.AUTH_PASS) {
            const expectedUser = env.AUTH_USER || "admin";
            const authHeader = request.headers.get("Authorization");
            const expectedAuth = "Basic " + btoa(expectedUser + ":" + env.AUTH_PASS);

            if (!authHeader || authHeader !== expectedAuth) {
              return new Response("Unauthorized: Protected by Cloudflare Pages", {
                status: 401,
                headers: {
                  "WWW-Authenticate": "Basic realm=\\"Restricted Access\\"",
                  "Content-Type": "text/plain; charset=utf-8"
                }
              });
            }
          }
          // ========================================
          `;

          // 在 fetch(request) 或 fetch(request, env) 入口处注入鉴权
          code = code.replace(/async\s+fetch\s*\(\s*request\s*(\,\s*env)?\s*(\,\s*ctx)?\s*\)\s*\{/, "async fetch(request, env, ctx) {" + authMiddleware);

          // 确保未匹配 API 时正确回退到静态前端页面
          code = code.replace(
            /return\s+json\(\{\s*message:\s*"API Not Found"\s*\}\,\s*404\);/,
            "return env.ASSETS ? env.ASSETS.fetch(request) : json({ message: \"API Not Found\" }, 404);"
          );

          fs.writeFileSync(file, code, "utf8");
          console.log("Universal Auth Guard injected successfully.");
          '

      - name: Commit and Push Changes
        run: |
          git add pages/
          if git diff --staged --quiet; then
            echo "No changes detected. Repository is up to date."
          else
            git commit -m "chore: sync upstream and enforce env-based auth lock"
            git push origin main
          fi
