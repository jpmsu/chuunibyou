name: Sync Upstream (Keep Custom README)

on:
  schedule:
    # 每天北京时间早上 8:00 (UTC 0:00) 自动检查并同步一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面随时手动点击“Run workflow”一键同步

# 必须授予仓库内容写入权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 获取完整提交历史，确保 3-way merge 正常运作

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/KJGX66F/usque-custom-pro.git
          git fetch upstream main

      - name: Sync & Preserve README
        run: |
          UPSTREAM_REV=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)

          # 1. 检查上游是否有新提交，若无更新则直接退出，节省 Actions 额度
          if [ "$UPSTREAM_REV" = "$MERGE_BASE" ]; then
            echo "✅ 已经是最新状态，上游没有新提交，无需同步。"
            exit 0
          fi

          echo "🚀 检测到上游有更新，开始执行安全合并..."

          # 2. 尝试不自动提交地合并上游 main 分支
          # 即使上游修改了 README.md 产生冲突，|| true 也能确保脚本不中断
          git merge upstream/main --no-commit --no-ff || true

          # 3. 核心铁律：强制用我们 fork 仓库已有的 README.md 覆盖任何改动或冲突状态
          git checkout HEAD -- README.md

          # 4. 检查除了 README 之外是否有代码变更需要提交
          if git diff-index --quiet HEAD --; then
            echo "上游仅更新了 README，无实质代码变动，跳过提交。"
          else
            git commit -m "chore: auto sync upstream (preserve custom README)"
            git push origin main
            echo "🎉 同步成功！已合并上游代码并保留了自建 README.md"
          fi
